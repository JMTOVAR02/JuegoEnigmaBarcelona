<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Juego Enigma Madrid</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <div>
        <ul>
          <li>
            <img src="./assets/svg/spain.svg" alt="Icono bandera de España" />
          </li>
          <li>
            <img
              src="./assets/svg/usa.svg"
              alt="Icono bandera de Estados Unidos"
            />
          </li>
        </ul>
      </div>
      <nav>
        <a href="https://juegoenigmamadrid.es/"
          ><img
            src="https://juegoenigmamadrid.es/wp-content/themes/juegoenigma/images/logo.png?x24212"
            alt="Logo Enigma"
        /></a>
        <div>
          <p>/MADRID</p>
          <span>+</span>
        </div>
        <ul>
          <li>
            <a href="https://juegoenigmamadrid.es/es/home/">Escape Room</a>
          </li>
          <li>Para regalar</li>
          <li>Empresas</li>
          <li>Colaboremos</li>
          <li>
            <a
              href="href=https://juegoenigmamadrid.es/es/reserva/"
              class="reservas"
              >Reservar</a
            >
          </li>
        </ul>
      </nav>
    </header>
    <main>
      <div class="main-container">
        <div class="reservas-container">
          <div class="reservas-container-boton">
            <img src="./assets/img/cable_izqiuerdo.png" alt="decoración" />
            <a href="https://juegoenigmamadrid.es/es/reserva/">RESERVAR</a>
            <img src="./assets/img/cable_derecho.png" alt="decoración" />
          </div>
          <div class="reservas-container-texto">
            <p>JUEGO DE ESCAPE EN VIVO</p>
            <p>Entretenimiento Inmersivo Y Alucinante</p>
            <p>
              Encuentra pistas, resuelve enigmas y escapa en menos de 60 minutos
            </p>
          </div>
        </div>
      </div>
      <div>
        <h1>Hola</h1>
      </div>
    </main>
  </body>
</html>
